---
# CPU fallback for the AI assistant. Works on any cluster, no GPU required.
# The architectural point in act 6 is about WHERE inference happens, and that
# survives intact on a smaller model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    app: AI_SERVICE_NAME_PLACEHOLDER
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: AI_SERVICE_NAME_PLACEHOLDER
  template:
    metadata:
      labels:
        app: AI_SERVICE_NAME_PLACEHOLDER
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.5.7
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_ORIGINS
              value: "*"
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "4", memory: 10Gi}
          volumeMounts:
            - name: models
              mountPath: /models
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: AI_SERVICE_NAME_PLACEHOLDER-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER-models
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: AI_SERVICE_NAME_PLACEHOLDER
  ports:
    - name: http
      port: 11434
      targetPort: 11434
