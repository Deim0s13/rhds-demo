---
# vLLM runtime image and args are discovered from the cluster's own
# vllm-cuda-runtime-template by scripts/lib.sh::discover_vllm_image, and
# substituted here. Do not pin a guessed image: a runtime that does not match
# the installed RHOAI version fails deep inside vLLM startup, after a 9GB pull,
# with an error that reads like a model problem rather than a version problem.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-coder-runtime
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM Coder Runtime (GPU)
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  containers:
    - name: kserve-container
      image: VLLM_IMAGE_PLACEHOLDER
      # Deliberately minimal, matching the args Red Hat's own template ships.
      # vLLM autodetects dtype and memory for a 3B model on a full GPU, and
      # hand-tuned flags are the fastest way to break this across versions.
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name=AI_MODEL_PLACEHOLDER"
        # Llama 3.2 advertises 131k context and vLLM v1 sizes the KV cache to
        # serve one request at full length, which does not fit on a single GPU.
        # Code completion sends a few hundred tokens of surrounding file, so 8k
        # is generous. This is the arg to raise if you ever want longer prompts,
        # and the first one to lower if you move to a smaller card.
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
        limits:
          cpu: "8"
          memory: 32Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Coding Assistant Model
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # One GPU means a rolling update can never complete: the new pod waits for
    # a GPU the old pod is still holding, and sits Pending indefinitely while
    # the old one serves happily. Recreate stops that dead.
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-coder-runtime
      # ModelCar: weights shipped as an OCI image. On a five-day cluster this is
      # materially more reliable than pulling from object storage at startup,
      # and it puts the model under the same registry controls as everything else.
      storageUri: "AI_MODEL_IMAGE_PLACEHOLDER"
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
