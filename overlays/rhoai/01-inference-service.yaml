---
# vLLM runtime image and args come from the cluster's own
# vllm-cuda-runtime-template, discovered by scripts/lib.sh::discover_vllm_image
# and substituted here.
#
# DO NOT PIN A GUESSED IMAGE. RHOAI ships runtime images matched to its version,
# and a mismatched one fails deep inside vLLM startup AFTER an 18GB pull, with
# an error that reads like a model problem rather than a version problem. The
# digest also differs per environment: ba060ec1... on one cluster, c056e616...
# on the next, three weeks apart. Discovery handles that; a pin would not.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-coder-runtime
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM Coder Runtime (GPU)
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  containers:
    - name: kserve-container
      image: VLLM_IMAGE_PLACEHOLDER
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name=AI_MODEL_PLACEHOLDER"
        # Llama 3.2 advertises 131k context and vLLM v1 sizes the KV cache to
        # serve one request at full length, which needs 14.0 GiB against 13.41
        # available and fails engine init. Code completion sends a few hundred
        # tokens of surrounding file, so 8k is generous.
        #
        # This is also the honest answer to "how many developers can one GPU
        # serve": the constraint is the KV cache, which scales with context
        # length times concurrent requests, not the model weights.
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
        limits:
          cpu: "8"
          memory: 32Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Coding Assistant Model
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    # One GPU means a rolling update can never complete: the new pod waits for
    # a GPU the old pod still holds and sits Pending indefinitely while the old
    # one serves happily. Recreate stops that dead.
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-coder-runtime
      # ModelCar: weights shipped as an OCI image. On a five-day cluster this is
      # materially more reliable than pulling from object storage at startup,
      # and it puts the model under the same registry controls as everything
      # else. up.sh validates the reference before applying anything.
      storageUri: "AI_MODEL_IMAGE_PLACEHOLDER"
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
