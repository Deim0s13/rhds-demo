---
# vLLM serving runtime on GPU. RHOAI ships an equivalent template out of the box;
# this is declared explicitly so the demo does not depend on which templates
# happen to be present on a freshly requested environment.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-coder-runtime
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: vLLM Coder Runtime (GPU)
    opendatahub.io/template-display-name: vLLM ServingRuntime for KServe
spec:
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  multiModel: false
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.16-cuda
      command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name=AI_MODEL_PLACEHOLDER"
        # Coding assistants send long file context. Cap it so the model fits
        # comfortably on a single GPU rather than failing at load time.
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
        - "--dtype=auto"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
        limits:
          cpu: "8"
          memory: 32Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: AI_SERVICE_NAME_PLACEHOLDER
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Coding Assistant Model
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-coder-runtime
      # ModelCar: weights shipped as an OCI image. On a five-day cluster this is
      # materially more reliable than pulling from object storage at startup,
      # and it puts the model under the same registry controls as everything else.
      storageUri: "AI_MODEL_IMAGE_PLACEHOLDER"
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
