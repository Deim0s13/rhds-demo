---
# Worth showing live in act 6. The inference endpoint is reachable from
# developer workspaces and from nothing else. On a laptop, "developers must
# only use the approved assistant" is a policy you trust people to follow.
# Here it is configuration you can point at.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-devspaces-to-inference
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  podSelector:
    matchLabels:
      component: predictor
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: che.eclipse.org
      ports:
        - protocol: TCP
          port: 8080
