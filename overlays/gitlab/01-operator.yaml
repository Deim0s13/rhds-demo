---
apiVersion: v1
kind: Namespace
metadata:
  name: GITLAB_NAMESPACE_PLACEHOLDER
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gitlab-operator
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  targetNamespaces:
    - GITLAB_NAMESPACE_PLACEHOLDER
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitlab-operator-kubernetes
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  channel: stable
  installPlanApproval: Automatic
  name: gitlab-operator-kubernetes
  source: community-operators
  sourceNamespace: openshift-marketplace
