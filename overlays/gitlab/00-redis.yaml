---
# Redis for GitLab. Also removed from the chart in 10.x. Red Hat's image again,
# for the same arbitrary-UID reason.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  # The chart expects the Redis password under this key.
  password: REDIS_PASSWORD_PLACEHOLDER
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: gitlab-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-redis
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab-redis
  template:
    metadata:
      labels:
        app: gitlab-redis
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitlab-redis, key: password }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          exec:
            command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-redis-data
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
