---
# S3-compatible object storage for GitLab.
#
# WHY NOT MINIO: MinIO deleted their Docker Hub repositories on 2026-09-11 and
# gated their Quay.io repositories on 2026-09-24. Every tag now refuses
# anonymous pulls, so no amount of tag pinning recovers it, and the last free
# community build carries an unpatched auth bypass (CVE-2026-40344, 8.8).
# SeaweedFS is the community replacement and keeps the S3 API, so nothing on
# the GitLab side changes beyond the endpoint and port.
#
# Chart 10.x demands an object storage connection even though this demo barely
# writes to it. This exists to satisfy the chart, not because three Git
# repositories need an object store.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-s3-credentials
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  accesskey: S3_ACCESS_KEY_PLACEHOLDER
  secretkey: S3_SECRET_KEY_PLACEHOLDER
---
# SeaweedFS reads its S3 identities from a JSON config rather than from
# environment variables the way MinIO did.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-seaweedfs-s3-config
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "gitlab",
          "credentials": [
            {
              "accessKey": "S3_ACCESS_KEY_PLACEHOLDER",
              "secretKey": "S3_SECRET_KEY_PLACEHOLDER"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
# The Rails side wants its S3 credentials as a YAML document under one key.
# Note the key is "config", which is what GitLab's own examples use, not
# "connection".
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-object-storage
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  config: |
    provider: AWS
    region: us-east-1
    aws_access_key_id: S3_ACCESS_KEY_PLACEHOLDER
    aws_secret_access_key: S3_SECRET_KEY_PLACEHOLDER
    endpoint: 'http://gitlab-seaweedfs.GITLAB_NAMESPACE_PLACEHOLDER.svc.cluster.local:8333'
    path_style: true
---
# The toolbox expects s3cmd format, not the Rails YAML above. Without it the
# toolbox crashloops on a missing /etc/gitlab/.s3cfg, which takes rails console
# and therefore seeding down with it.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-s3cmd-config
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  config: |
    [default]
    access_key = S3_ACCESS_KEY_PLACEHOLDER
    secret_key = S3_SECRET_KEY_PLACEHOLDER
    bucket_location = us-east-1
    host_base = gitlab-seaweedfs.GITLAB_NAMESPACE_PLACEHOLDER.svc.cluster.local:8333
    host_bucket = gitlab-seaweedfs.GITLAB_NAMESPACE_PLACEHOLDER.svc.cluster.local:8333/%(bucket)
    use_https = False
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-seaweedfs
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: gitlab-seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: master
      port: 9333
      targetPort: 9333
    - name: filer
      port: 8888
      targetPort: 8888
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-seaweedfs-data
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-seaweedfs
  namespace: GITLAB_NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab-seaweedfs
  template:
    metadata:
      labels:
        app: gitlab-seaweedfs
    spec:
      containers:
        - name: seaweedfs
          # Pinned deliberately. An unpinned tag is what turned a vendor's
          # registry change into a broken rebuild on a five-day cluster.
          image: docker.io/chrislusf/seaweedfs:4.47
          # "server" runs master, volume, filer and the S3 gateway in one
          # process. Correct for a demo; a real deployment separates them.
          args:
            - "server"
            - "-dir=/data"
            - "-s3"
            - "-s3.config=/etc/seaweedfs/s3.json"
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 9333
              name: master
            - containerPort: 8888
              name: filer
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            # TCP rather than an HTTP path. SeaweedFS health endpoints differ
            # per component, and a wrong probe path is how the Redis rollout
            # failed while the service itself was healthy.
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9333
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-seaweedfs-data
        - name: s3-config
          secret:
            secretName: gitlab-seaweedfs-s3-config
