---
# This is the segment that lands with a CISO.
#
# Dev Spaces mounts labelled secrets into every workspace in a user's namespace.
# The developer never types a credential, never stores one on a laptop, and
# cannot exfiltrate one to a machine outside the cluster. The platform team
# provisions it; the developer just clones.
#
# In a bank this is exactly the pattern, only the secret holds a Bitbucket Data
# Center or GitHub Enterprise service-account token, rotated by whatever already
# rotates your secrets. The mechanism does not change.
#
# NOTE ON SCOPE: this manifest targets a single developer namespace, because
# Dev Spaces reads these from the user's own namespace. Real deployments push
# them with a secret replication controller or an external secrets operator.
# scripts/gitea-credentials.sh applies it to your current user's namespace.
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials-gitea
  namespace: USER_NAMESPACE_PLACEHOLDER
  labels:
    controller.devfile.io/watch-secret: "true"
    controller.devfile.io/git-credential: "true"
  annotations:
    controller.devfile.io/mount-path: /home/user/.git-credentials
type: Opaque
stringData:
  # Format is what git credential-store expects.
  credentials: "https://GITEA_ADMIN_USER_PLACEHOLDER:GITEA_ADMIN_PASSWORD_PLACEHOLDER@GITEA_HOST_PLACEHOLDER"
---
# Tells git in the workspace to use the mounted store, and sets the committer
# identity so the developer is not prompted on first commit. Small thing, but
# in a live demo being prompted for user.email breaks the flow badly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workspace-gitconfig
  namespace: USER_NAMESPACE_PLACEHOLDER
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
  annotations:
    controller.devfile.io/mount-as: subpath
    controller.devfile.io/mount-path: /etc/gitconfig
data:
  gitconfig: |
    [credential]
      helper = store --file /home/user/.git-credentials
    [user]
      name = Demo Developer
      email = demo.developer@example.internal
    [http]
      sslVerify = false
    [init]
      defaultBranch = main
