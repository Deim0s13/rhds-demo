---
# Built in-cluster so the demo needs no external registry and no push
# credentials. The BuildConfig is itself part of the story: this is the shape of
# a platform team taking a community image and publishing a compliant one.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: gitea-openshift
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: gitea-openshift
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  source:
    type: Dockerfile
    dockerfile: |
      FROM docker.io/gitea/gitea:1.22-rootless
      USER 0
      RUN mkdir -p /var/lib/gitea /etc/gitea /tmp/gitea \
       && chgrp -R 0 /var/lib/gitea /etc/gitea /tmp/gitea \
       && chmod -R g=u /var/lib/gitea /etc/gitea /tmp/gitea
      USER 1000
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: docker.io/gitea/gitea:1.22-rootless
  output:
    to:
      kind: ImageStreamTag
      name: gitea-openshift:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
