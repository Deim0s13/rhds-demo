---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin
  namespace: DEMO_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  # Demo-only credentials. In a real environment this is your existing SCM and
  # the platform team provisions a service account, not a static admin password.
  username: "GITEA_ADMIN_USER_PLACEHOLDER"
  password: "GITEA_ADMIN_PASSWORD_PLACEHOLDER"
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-admin-env
  namespace: DEMO_NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  GITEA_ADMIN_USERNAME: "GITEA_ADMIN_USER_PLACEHOLDER"
  GITEA_ADMIN_PASSWORD: "GITEA_ADMIN_PASSWORD_PLACEHOLDER"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: DEMO_NAMESPACE_PLACEHOLDER
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:1.22
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              value: "https://GITEA_HOST_PLACEHOLDER/"
            - name: GITEA__server__DOMAIN
              value: "GITEA_HOST_PLACEHOLDER"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            # Demo posture. A real deployment would not disable registration
            # checks or run without an external database.
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__repository__DEFAULT_BRANCH
              value: main
            - name: GITEA__actions__ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: gitea-admin-env
          lifecycle:
            postStart:
              exec:
                # Gitea only creates an admin through its CLI, and only once.
                # Idempotent: the second run fails harmlessly because the user
                # already exists, which is what we want on a pod restart.
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 20
                    su git -c "gitea admin user create \
                      --admin \
                      --username ${GITEA_ADMIN_USERNAME} \
                      --password ${GITEA_ADMIN_PASSWORD} \
                      --email admin@example.internal \
                      --must-change-password=false" || true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: DEMO_NAMESPACE_PLACEHOLDER
spec:
  to:
    kind: Service
    name: gitea
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
