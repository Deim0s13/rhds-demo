schemaVersion: 2.2.0
metadata:
  name: payments-service
  displayName: Payments Service
  description: Spring Boot payments service. Approved Java 21 stack.
  language: Java
  projectType: springboot
  tags:
    - Java
    - Spring Boot
    - Approved

# No projects block. When a workspace is created from this repository's URL,
# Dev Spaces clones that repository automatically. Declaring it again would be
# redundant, and pinning a remote here is what ties a devfile to one SCM.
components:
  - name: tools
    container:
      # In a bank this is your internally built, scanned image carrying the
      # corporate CA bundle. Platform team owns it: one rebuild on a CVE,
      # not four hundred laptops.
      image: registry.access.redhat.com/ubi9/openjdk-21:latest
      memoryRequest: 1Gi
      memoryLimit: 4Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      env:
        - name: MAVEN_OPTS
          value: "-Xmx2048m"
        # Rendered at seed time from demo.env. Inference stays inside the
        # cluster: no code leaves the boundary to get a completion.
        - name: AI_BASE_URL
          value: "AI_BASE_URL_PLACEHOLDER"
        - name: AI_MODEL
          value: "AI_MODEL_PLACEHOLDER"
        # The assistant expects a key field even where the endpoint does not
        # check one. Never put a real credential in a devfile.
        - name: AI_API_KEY
          value: "not-required-in-cluster"
      endpoints:
        - name: http-payments
          targetPort: 8080
          exposure: public
          protocol: https
        - name: debug
          targetPort: 5005
          exposure: none
      volumeMounts:
        - name: m2
          path: /home/user/.m2
  - name: m2
    volume:
      size: 3Gi

commands:
  - id: build
    exec:
      component: tools
      commandLine: "mvn -B clean package -DskipTests"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run
    exec:
      component: tools
      commandLine: "mvn -B spring-boot:run"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
  - id: test
    exec:
      component: tools
      commandLine: "mvn -B test"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
  - id: debug
    exec:
      component: tools
      commandLine: "mvn -B spring-boot:run -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: debug
        isDefault: true
