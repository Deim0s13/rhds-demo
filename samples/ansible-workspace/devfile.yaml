schemaVersion: 2.2.0
metadata:
  name: ansible-automation-workspace
  displayName: Ansible Automation Workspace
  description: Governed authoring environment for Ansible content, with dev tools, linting and molecule testing preinstalled
  language: Ansible
  projectType: ansible
  tags:
    - Ansible
    - Automation
    - Platform

projects:
  - name: ansible-workspace
    git:
      remotes:
        origin: "https://github.com/GIT_ORG_PLACEHOLDER/GIT_REPO_PLACEHOLDER.git"
      checkoutFrom:
        revision: GIT_BRANCH_PLACEHOLDER
    subDir: samples/ansible-workspace

# Ships the Ansible VS Code extension into the browser IDE so linting and
# module documentation work the moment the workspace opens. This is the point
# worth making out loud: the platform team decides which extensions are present,
# not each individual laptop.
attributes:
  controller.devfile.io/devworkspace-config:
    name: devworkspace-config
    namespace: openshift-devspaces
  controller.devfile.io/scc: container-build

components:
  - name: tooling
    container:
      # Red Hat community Ansible dev tools: ansible-core, ansible-lint,
      # ansible-navigator, molecule, ansible-builder in one image.
      image: ghcr.io/ansible/community-ansible-dev-tools:latest
      memoryRequest: 1Gi
      memoryLimit: 6Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      args: ["tail", "-f", "/dev/null"]
      env:
        - name: ANSIBLE_CONFIG
          value: ${PROJECT_SOURCE}/ansible.cfg
        - name: ANSIBLE_LOCALHOST_WARNING
          value: "False"
        # Rendered by scripts/render-devfiles.sh from demo.env, then committed.
        # Dev Spaces fetches this file directly from Git, so it cannot contain
        # placeholders the way the bootstrap manifests do.
        - name: AI_BASE_URL
          value: "http://coder-model-predictor.devspaces-demo.svc.cluster.local:8080/v1"
        - name: AI_MODEL
          value: "qwen2.5-coder-7b-instruct"
        # The assistant needs a key field even when the endpoint does not check
        # one. Never put a real credential in a devfile; inject it as a secret.
        - name: AI_API_KEY
          value: "not-required-in-cluster"

commands:
  - id: lint
    exec:
      component: tooling
      commandLine: "ansible-lint playbooks/"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
  - id: syntax-check
    exec:
      component: tooling
      commandLine: "ansible-playbook --syntax-check playbooks/site.yml"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run-playbook
    exec:
      component: tooling
      commandLine: "ansible-playbook -i inventory/hosts playbooks/site.yml"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true
  - id: molecule-test
    exec:
      component: tooling
      commandLine: "cd roles/demo_baseline && molecule test || echo 'Molecule scenario not initialised, see docs/ANSIBLE-STACK.md'"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
