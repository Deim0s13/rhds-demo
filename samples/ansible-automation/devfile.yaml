schemaVersion: 2.2.0
metadata:
  name: ansible-automation
  displayName: Ansible Automation Workspace
  description: Governed authoring environment for Ansible content, with dev tools, linting and molecule preinstalled
  language: Ansible
  projectType: ansible
  tags:
    - Ansible
    - Automation
    - Approved

components:
  - name: tooling
    container:
      # Ansible dev tools: ansible-core, ansible-lint, ansible-navigator,
      # molecule and ansible-builder in one image. The platform team decides
      # which tooling is present, not each individual laptop. That is the point
      # of this act: automation content deserves the same governed authoring
      # loop as application code.
      # Pinned. :latest moved under us between environments, which is the same
      # class of problem as the MinIO story in act 3 and worth saying out loud.
      # Confirm before an environment you care about:
      #   oc image info ghcr.io/ansible/community-ansible-dev-tools:v26.9.0
      image: ghcr.io/ansible/community-ansible-dev-tools:v26.9.0
      command: ["tail"]
      args: ["-f", "/dev/null"]
      memoryRequest: 1Gi
      memoryLimit: 8Gi
      cpuRequest: 500m
      cpuLimit: 2000m
      mountSources: true
      env:
        - name: ANSIBLE_CONFIG
          value: ${PROJECT_SOURCE}/ansible.cfg
        - name: ANSIBLE_LOCALHOST_WARNING
          value: "False"
        - name: AI_BASE_URL
          value: "AI_BASE_URL_PLACEHOLDER"
        - name: AI_MODEL
          value: "AI_MODEL_PLACEHOLDER"
        - name: AI_API_KEY
          value: "not-required-in-cluster"

commands:
  - id: lint
    exec:
      component: tooling
      commandLine: "ansible-lint playbooks/"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true
  - id: syntax-check
    exec:
      component: tooling
      commandLine: "ansible-playbook --syntax-check playbooks/site.yml"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true
  - id: run-playbook
    exec:
      component: tooling
      commandLine: "ansible-playbook -i inventory/hosts playbooks/site.yml"
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: run
        isDefault: true

  # Points the Continue extension at the in-cluster model. Same rationale as in
  # payments-service: without this the AI_* env vars above are decoration and the
  # only assistant present is whatever the developer already had signed in.
  #
  # The component is "tooling" here, not "tools". Getting that wrong gives a
  # devfile that validates and a command that never runs.
  - id: configure-ai
    exec:
      component: tooling
      commandLine: |
        set -e
        if [ -z "${AI_BASE_URL}" ]; then
          echo "AI_BASE_URL is empty, skipping assistant configuration"
          exit 0
        fi
        mkdir -p "${HOME}/.continue"
        cat > "${HOME}/.continue/config.yaml" <<EOF
        name: In-cluster model
        version: 1.0.0
        schema: v1
        models:
          - name: ${AI_MODEL}
            provider: openai
            model: ${AI_MODEL}
            apiBase: ${AI_BASE_URL}
            apiKey: ${AI_API_KEY}
            roles:
              - chat
              - autocomplete
              - edit
        EOF
        echo "assistant configured against ${AI_BASE_URL}"

events:
  postStart:
    - configure-ai
